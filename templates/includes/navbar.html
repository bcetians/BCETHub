{% load static %}

<nav class="navbar">
    <div class="nav-container">
        <div class="left">
            <a href="{% url 'home' %}" class="brand-link">
                <p><span>BCET</span>Hub</p>
            </a>
        </div>
        
        <div class="search-container">
            <form action="{% url 'search' %}" method="GET" class="search-form">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" 
                       name="q" 
                       id="search-input"
                       value="{{ query|default:'' }}" 
                       placeholder="Search everything... clubs, students, notes, routine" 
                       aria-label="Search"
                       hx-get="{% url 'live_search' %}"
                       hx-trigger="input changed delay:150ms, keyup changed delay:150ms"
                       hx-target="#live-search-popup"
                       hx-on::after-swap="if(window.lucide) lucide.createIcons()"
                       autocomplete="off">
            </form>
            <div id="live-search-popup" class="live-search-popup"></div>
        </div>

        <div class="nav-links">
            <a href="{% url 'home' %}" class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}" title="Home">
                <i data-lucide="home"></i>
                <span>Home</span>
            </a>
            <a href="{% url 'routine' %}" class="nav-item {% if request.resolver_match.url_name == 'routine' %}active{% endif %}" title="Routine">
                <i data-lucide="calendar"></i>
                <span>Routine</span>
            </a>
            <a href="{% url 'study' %}" class="nav-item {% if request.resolver_match.url_name == 'study' %}active{% endif %}" title="Study">
                <i data-lucide="book-text"></i>
                <span>Study</span>
            </a>
            <!-- <a href="{% url 'induction' %}" class="nav-item {% if request.resolver_match.url_name == 'induction' %}active{% endif %}" title="Induction">
                <i data-lucide="award"></i>
                <span>Induction</span>
            </a> -->
            <a href="{% url 'mess_menu' %}" class="nav-item {% if request.resolver_match.url_name == 'mess_menu' %}active{% endif %}" title="Mess Menu">
                <i data-lucide="utensils"></i>
                <span>Mess Menu</span>
            </a>
            <!-- <a href="{% url 'about' %}" class="nav-item {% if request.resolver_match.url_name == 'about' %}active{% endif %}" title="About">
                <i data-lucide="info"></i>
                <span>About</span>
            </a> -->
            <a href="{% url 'community' %}" class="nav-item {% if request.resolver_match.url_name == 'community' %}active{% endif %}" title="Community">
                <i data-lucide="user-group"></i>
                <span>Community</span>
            </a>

            
        {% if request.user.is_authenticated %}
            <a href="{% url 'student_portfolio_profile' username=request.user.username %}"
                class="nav-item {% if request.resolver_match.url_name == 'student_portfolio_profile' %}active{% endif %}"
                title="Profile">

                {% if request.user.student_portfolio.profile_pic %}
                    <img
                        src="{{ request.user.student_portfolio.profile_pic.url }}"
                        alt="{{ request.user.username }}"
                        class="nav-profile-pic {% if request.resolver_match.url_name == 'student_portfolio_profile' %}active{% endif %}"
                    >
                {% elif request.user.community_profile.group_logo %}
                    <img
                        src="{{ request.user.community_profile.group_logo.url }}"
                        alt="{{ request.user.username }}"
                        class="nav-profile-pic {% if request.resolver_match.url_name == 'student_portfolio_profile' %}active{% endif %}"
                    >
                {% else %}
                    <img
                        src="{% static 'img/defult.jpeg' %}"
                        alt="{{ request.user.username }}"
                        class="nav-profile-pic {% if request.resolver_match.url_name == 'student_portfolio_profile' %}active{% endif %}"
                    >
                {% endif %}
                <span>@{{ request.user.username }}</span>
            </a>
        {% else %}
            <a href="{% url 'student_login' %}"
                class="nav-item {% if request.resolver_match.url_name == 'student_login' or request.resolver_match.url_name == 'create_portfolio_account' %}active{% endif %}"
                title="Student Portfolio" title="Login">

                <i data-lucide="log-in"></i>
                <span>Login</span>
            </a>
        {% endif %}

        </div>
    </div>
</nav>
